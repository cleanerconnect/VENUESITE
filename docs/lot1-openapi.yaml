# Généré par une lecture du code, pas écrit à la main.
# Voir info.description pour les trois sources et leur ordre.
openapi: 3.1.0
info:
  title: LYFE · Business Service — contrat du Lot 1
  version: 1.0.0
  summary: Ce que le Portail Partenaire appelle, tel qu'il l'appelle.
  description: |
    Le tableau de bord basique de `Planning Lyfe V3`, sprint `Prio 02` —
    « Dashobaord basique (Authentification + Création de Venue + Gestion des
    reservation uniquement) ».

    **Ce fichier est dérivé du code, pas de la documentation.** Trois
    sources, dans cet ordre :

    1. `src/lib/data/http-repository.ts` — la méthode, le chemin, la chaîne
       de requête, les en-têtes et le corps, tels que le pilote HTTP les
       envoie. C'est **la** référence : ce fichier est écrit à partir d'elle
       et non l'inverse.
    2. Le trafic capturé pendant qu'une passe complète de vérification du
       lot 1 tournait contre `tools/mock-api.mjs` — 514 appels, 19 endpoints
       distincts, aucun 404. Les formes de réponse en viennent, champ par
       champ. Chaque opération dit si elle a été observée.
    3. `src/lib/types/*.ts` pour les quelques charges qu'aucun outil du lot 1
       ne déclenche.

    Là où `docs/LOT1_API_CONTRACT.md` et ce fichier divergeaient, c'est le
    markdown qui a été corrigé.

    ## Sécurité, et une chose à lire avant de construire

    Le portail est un **client serveur à serveur**. Il porte un jeton de
    service unique — `LYFE_API_TOKEN` — et l'identité du partenaire voyage
    en paramètre : `user_id` sur la session, `venue_id` sur les appels
    scopés. Il n'existe pas de jeton par partenaire.

    Deux conséquences, et la seconde est une obligation :

    * Le commentaire « le service résout le périmètre depuis le jeton » qui
      a circulé est **faux** pour ce montage : avec un seul jeton, `venue_id`
      est le seul signal de périmètre. Le portail vérifie lui-même, à chaque
      écriture, que le partenaire connecté détient l'établissement
      (`requireVenueAccess`), et le service doit le vérifier aussi — deux
      contrôles, parce qu'un seul est un contrôle qu'on oublie.
    * **Ce jeton ne doit jamais être accepté depuis un navigateur.** Il
      n'est lu que dans du code serveur (`server-only`), il n'est jamais
      envoyé au client, et le service devrait refuser l'origine d'un
      navigateur sur ces routes.

    Le `401` a un sens précis ici : « le service ne nous connaît pas », pas
    « ce partenaire n'a pas le droit ». Le second est un `403`. Le portail
    traite les deux différemment.
  contact:
    name: LYFE · Portail Partenaire
    url: https://github.com/cleanerconnect/VENUESITE
  license:
    name: Propriétaire
    identifier: LicenseRef-LYFE
servers:
- url: '{baseUrl}'
  description: '`LYFE_API_BASE_URL`. Le portail n''ajoute rien : les chemins ci-dessous sont
    concaténés tels quels.'
  variables:
    baseUrl:
      default: http://localhost:3311
      description: Le double exécutable, `tools/mock-api.mjs`.
security:
- serviceToken: []
tags:
- name: Authentification
  description: Connexion, session, mot de passe oublié.
- name: Inscription
  description: '« Création de Venue » : quatre appels.'
- name: Réservations
  description: '« Gestion des reservation » : le carnet et les décisions.'
- name: Check-in
  description: Honorer une réservation à la porte.
- name: Ma fiche
  description: L'établissement tel que l'application le montre.
- name: Disponibilités
  description: Ce qui décide de ce que l'application propose.
- name: Notifications
  description: Ce dont le partenaire est prévenu, et par quel canal.
- name: Établissement
  description: Réglages transverses lus par les six écrans.
- name: Revue LYFE
  description: SP-Prio 03. Réservé à l'administration LYFE.
paths:
  /api/business/auth/session:
    post:
      tags:
      - Authentification
      summary: Échanger une adresse et un mot de passe contre un compte
      operationId: signIn
      description: |
        Le seul endroit où un mot de passe circule. Une adresse inconnue et un mot de passe faux répondent **le même** `401` avec le même `code` : deux réponses différentes feraient de ce formulaire l'annuaire des partenaires de LYFE.

        À limiter en débit côté service : le portail plafonne à dix tentatives par adresse et par minute, en mémoire de processus, ce qui ne vaut que pour une instance.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccount'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
    get:
      tags:
      - Authentification
      summary: Le compte derrière un identifiant connu
      operationId: readSession
      description: |
        Appelé à **chaque requête** du portail pour résoudre identité, périmètre et rôle. Le pilote mémorise la réponse cinq secondes (`HttpDirectory.TTL_MS`) : une navigation ne devient pas cinq allers-retours, et un changement de rôle met au pire cinq secondes à prendre effet.

        `user_id` **ou** `email`, jamais les deux.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: string
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessAccount'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/auth/password-reset:
    post:
      tags:
      - Authentification
      summary: Demander un lien de réinitialisation
      operationId: requestPasswordReset
      description: |
        **La même réponse pour une adresse connue et une adresse inconnue** — un `404` sur une adresse absente transformerait ce formulaire en annuaire. `422` uniquement quand la chaîne n'est pas une adresse.

        Le portail n'affiche « un lien vient d'être envoyé » qu'après avoir reçu le `204`. Le lien, sa durée de vie, son usage unique et l'écran qui accepte le nouveau mot de passe appartiennent au service : le lot 1 ne les rend pas.

        Non observé pendant la passe : aucun outil du lot 1 ne déclenche cet appel. La forme vient des types TypeScript que le pilote impose (`src/lib/types/`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Demande acceptée. Ne dit pas si le compte existe.
        '422':
          description: Corps syntaxiquement valide, contenu refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/onboarding:
    post:
      tags:
      - Inscription
      summary: Créer le compte et son brouillon — inscription, étape 1
      operationId: startOnboarding
      description: |
        Le compte existe à partir d'ici, sans établissement. `409` quand l'adresse est déjà prise : c'est la seule chose que ce endpoint révèle, et le portail l'affiche comme « Cette adresse a déjà un compte. Connectez-vous. »

        `Détail Sprint ` ligne 39 demande en plus un code de vérification envoyé par e-mail ou WhatsApp, et l'écran qui le saisit. Ni l'un ni l'autre n'existent — voir `docs/AUDIT_LOT1.md`, constat A-04.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - email
              - phone
              - password
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                type: object
                required:
                - userId
                - draft
                properties:
                  userId:
                    type: string
                  draft:
                    $ref: '#/components/schemas/OnboardingDraft'
        '409':
          description: 'Conflit : la ressource a changé depuis sa lecture (`expectedVersion`,
            ou un état déjà décidé).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Corps syntaxiquement valide, contenu refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/onboarding/{draftId}:
    get:
      tags:
      - Inscription
      summary: Reprendre un brouillon
      operationId: readOnboardingDraft
      description: |
        Le brouillon vit côté service, pas dans le navigateur : fermer l'onglet ne perd rien et le partenaire peut finir sur un autre appareil.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: Le brouillon.
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDraft'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
    put:
      tags:
      - Inscription
      summary: Enregistrer une étape — étapes 2 à 5
      operationId: saveOnboardingDraft
      description: |
        Un patch partiel : seuls les champs présents changent. `step` est l'étape la plus avancée atteinte et ne recule pas.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: Le brouillon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                step:
                  type: integer
                venueName:
                  type: string
                venueType:
                  type: string
                  enum:
                  - restaurant
                  - bar
                city:
                  type: string
                address:
                  type: string
                latitude:
                  type:
                  - number
                  - 'null'
                longitude:
                  type:
                  - number
                  - 'null'
                coverObjectKey:
                  type: string
                coverContentType:
                  type: string
                coverSizeBytes:
                  type: integer
                hours:
                  type: array
                  items:
                    $ref: '#/components/schemas/OnboardingDay'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDraft'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Corps syntaxiquement valide, contenu refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/onboarding/{draftId}/submit:
    post:
      tags:
      - Inscription
      summary: Créer l'établissement — étape 6
      operationId: submitOnboarding
      description: |
        **Idempotent** : un brouillon déjà consommé rend l'établissement qu'il a créé plutôt qu'un second. L'établissement naît `pending_review` — son tableau de bord fonctionne entièrement, l'application ne le liste pas.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - name: draftId
        in: path
        required: true
        schema:
          type: string
        description: Le brouillon.
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                type: object
                required:
                - venueId
                properties:
                  venueId:
                    type: string
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: 'Conflit : la ressource a changé depuis sa lecture (`expectedVersion`,
            ou un état déjà décidé).'
          content:
            application/json:
