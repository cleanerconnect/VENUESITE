      description: |
        `rejected`, **pas** `cancelled` : l'établissement a refusé, le client n'a pas renoncé. Les deux états restent distincts de bout en bout. Le motif est codé pour être exploitable en aval ; la note est libre.

        Non observé pendant la passe : aucun outil du lot 1 ne déclenche cet appel. La forme vient des types TypeScript que le pilote impose (`src/lib/types/`).
