      summary: Accepter une réservation
      operationId: confirmBooking
      description: |
        « pour accepter ou refuser la reservation » — `Détail Sprint ` ligne 46. Doit être un compare-and-set sur l'état lu : deux hôtes qui décident en même temps ne doivent pas produire deux transitions depuis le même état. `409` pour celui qui perd.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
