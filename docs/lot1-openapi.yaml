      operationId: runConfigurationAction
      description: |
        Une action JSON plutôt qu'un endpoint par champ : le `kind` est ce sur quoi le service branche. `expectedVersion` porte la concurrence optimiste — une version périmée répond `409` et le portail dit « a changé entre-temps ».

        Actions du lot 1 : `service.create`, `service.edit`, `service.remove`, `service.set`, `pacing.set`.

