  /api/business/overview:
    get:
      tags:
      - Réservations
      summary: Le paquet que six écrans lisent
      operationId: getOverview
      description: |
        Un appel, et l'Accueil, Réservations, Check-in, Ma fiche, Disponibilités et Notifications ont ce qu'il leur faut. C'est l'endpoint le plus appelé du portail.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - &id001
        name: venue_id
        in: query
        required: true
        schema:
          type: string
        description: 'L''établissement. **Un indice, pas une autorisation** : voir §Sécurité.'
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantOverview'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: Le jeton est valide et ne porte pas ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/bookings:
    get:
      tags:
      - Réservations
      summary: Le carnet d'un jour
      operationId: getDayBook
      description: |
        Ce que Réservations lit quand le partenaire marche vers un autre jour. La fenêtre que le portail propose est de sept jours en arrière et trente en avant. Un jour sans service doit répondre `200` avec des tableaux vides, jamais `404` : une journée de fermeture est une information, pas une erreur.

        Observé en trafic réel pendant la passe de vérification du lot 1.
      parameters:
      - *id001
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: AAAA-MM-JJ, dans le calendrier du lieu (Africa/Casablanca).
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayBook'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
