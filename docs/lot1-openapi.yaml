  /api/business/venues/pending:
    get:
      tags:
      - Revue LYFE
      summary: Les établissements qui attendent la revue de LYFE
      operationId: listPendingVenues
      description: |
        **Réservé à LYFE.** L'autorisation n'est pas un rôle sur un établissement : un propriétaire ne doit jamais pouvoir valider sa propre annonce. Le service doit refuser ce endpoint à tout jeton qui n'est pas celui de l'administration.

        Relève de `Détail Sprint ` ligne 55, `SP-Prio 03`, et non de Prio 02.

        Non observé pendant la passe : aucun outil du lot 1 ne déclenche cet appel. La forme vient des types TypeScript que le pilote impose (`src/lib/types/`).

        Le portail ne demande ce endpoint **jamais** sur le pilote HTTP : `src/lib/auth/platform.ts` répond « personne n'est administrateur » dès que le pilote n'est pas `db`, délibérément — inventer un administrateur LYFE pour un instantané figé mettrait une file de validation devant quelqu'un qui regarde une démonstration. Tant que cette porte reste fermée, `/admin/validations` est un `404` sur le double et ce endpoint ne peut pas être éprouvé contre lui. C'est assumé : l'écran relève de `SP-Prio 03` et non du périmètre de recette du lot 1 — constat `C-07` de l'audit.
      responses:
        '200':
          description: Succès.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingVenue'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: Le jeton est valide et ne porte pas ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/business/venues/{venueId}/validation:
    put:
      tags:
      - Revue LYFE
      summary: Valider ou refuser une annonce
      operationId: decideVenueValidation
      description: |
        `validated` la rend visible dans l'application ; `rejected` demande un motif, et ce motif est **la seule chose que le partenaire verra**. Le tableau de bord du partenaire fonctionne dans les trois états.

        Non observé pendant la passe : aucun outil du lot 1 ne déclenche cet appel. La forme vient des types TypeScript que le pilote impose (`src/lib/types/`).

        Le portail ne demande ce endpoint **jamais** sur le pilote HTTP : `src/lib/auth/platform.ts` répond « personne n'est administrateur » dès que le pilote n'est pas `db`, délibérément — inventer un administrateur LYFE pour un instantané figé mettrait une file de validation devant quelqu'un qui regarde une démonstration. Tant que cette porte reste fermée, `/admin/validations` est un `404` sur le double et ce endpoint ne peut pas être éprouvé contre lui. C'est assumé : l'écran relève de `SP-Prio 03` et non du périmètre de recette du lot 1 — constat `C-07` de l'audit.
      parameters:
      - name: venueId
        in: path
        required: true
        schema:
          type: string
        description: L'établissement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - validated
                  - rejected
                reason:
                  type: string
                  description: Obligatoire quand `status` vaut `rejected`.
      responses:
        '200':
          description: La file telle qu'elle est après la décision.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingVenue'
        '401':
          description: Jeton manquant ou refusé. Le portail traite ce code comme « le service
            ne nous connaît pas » et non comme « ce partenaire n'a pas le droit » — voir §Sécurité.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: Le jeton est valide et ne porte pas ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: La ressource n'existe pas, ou n'existe pas pour ce périmètre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Corps syntaxiquement valide, contenu refusé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Défaillance du service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer ${LYFE_API_TOKEN}`, sur chaque requête, y compris
        les lectures. Un jeton de service, pas un jeton de partenaire — voir §Sécurité.'
  schemas:
    Erreur:
      type: object
      properties:
        code:
          type: string
          description: Code stable, lu par le portail pour décider du message. `RepositoryError.code`.
        message:
          type: string
          description: Phrase en français, affichée telle quelle au partenaire quand le portail
            n'a pas de message plus précis.
      required:
      - code
      - message
      description: Le corps de toute réponse ≥ 400. Le pilote lit exactement ces deux champs
        (`src/lib/data/http-repository.ts`, `safeJson`) ; un corps d'une autre forme devient
        « Une erreur est survenue ».
    Membership:
      type: object
      properties:
        id:
          type: string
          description: Identifiant de l'établissement.
        name:
          type: string
        shortName:
          type: string
        initials:
          type: string
          description: Deux caractères, pastille de la barre latérale.
        city:
          type: string
        kind:
          type: string
          enum:
          - restaurant
          - drinks
        role:
          type: string
          enum:
          - owner
          - manager
          - staff
      required:
      - id
      - name
      - shortName
      - initials
      - city
      - kind
      - role
    BusinessAccount:
      type: object
      properties:
        userId:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - userId
      - fullName
      - email
      - venues
      description: 'Identité, périmètre et rôle en une réponse. Le portail n''a aucune autre
        source : il ne décide d''aucun accès localement.'
    Reservation:
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
          description: Le service auquel la réservation est rattachée. Vide pour une réservation
            prise pour un jour à venir, que le portail place alors par son heure.
        guestName:
          type: string
        guestPhone:
          type: string
          description: Peut être vide. Affiché sur la ligne du carnet.
        partySize:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
          description: Instant ISO 8601 avec fuseau.
        state:
          type: string
          enum:
          - requested
          - confirmed
          - modified
          - cancelled
          - rejected
          - waitlisted
          - arrived
          - no_show
          - completed
        channel:
          type: string
          enum:
          - lyfe
          - phone
          - whatsapp
          - walk_in
          - partner
          - instagram
          description: '**Minuscules.** `LYFE` n''est pas une valeur.'
        zoneId:
          type: string
          description: Facultatif.
        note:
          type: string
          description: Demande particulière. Peut contenir une allergie, donc une donnée de
            santé au sens de la loi 09-08.
        guestEmail:
          type: string
          format: email
          description: Facultatif.
        guestBirthYear:
          type: integer
          description: Facultatif. **Ne pas envoyer** sans finalité déclarée ni consentement
            — voir le contrat §3.2.
        visits:
          type: integer
          description: Nombre de passages de ce client dans cet établissement.
        vip:
          type: boolean
        noShowRisk:
          type: number
          format: double
          description: 0 à 1. Lu par le lot 2 seulement.
      required:
      - id
      - guestName
      - guestPhone
      - partySize
      - at
      - state
      - channel
    SlotLoad:
      type: object
      properties:
        at:
          type: string
          format: date-time
        covers:
          type: integer
      required:
      - at
      - covers
    Service:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - petit_dejeuner
          - dejeuner
          - diner
          - tardif
          - creneau
        label:
          type: string
        date:
          type: string
          format: date
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - scheduled
          - open
          - peak
          - closing
          - closed
        capacity:
          type: integer
        bookedCovers:
